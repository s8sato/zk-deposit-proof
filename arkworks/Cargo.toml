[package]
name = "arkworks"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ff = { version = "0.4", default-features = false, features = ["asm"] }
ark-ec = { version = "0.4", default-features = false }
ark-bn254 = "0.4"
ark-ed-on-bn254 = { version = "0.4", features = ["r1cs"] }
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-r1cs-std = { version = "0.4", default-features = false }
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh"] }
ark-snark = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
rand = "0.8"

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "benchmark"
path = "benches/benchmark.rs"
